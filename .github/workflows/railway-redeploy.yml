name: Futmondo - Railway execute

on:
  workflow_dispatch:
  push:
    paths:
      - 'scheduler/railway-redeploy-test.txt'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Validar token
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Falta RAILWAY_API_TOKEN"
            exit 1
          fi

      - name: Reiniciar deployment actual de futmondo-reader
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          query='{"query":"query Instance($serviceId: String!, $environmentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { latestDeployment { id status createdAt } } }","variables":{"serviceId":"24bc953e-a219-48c8-a7e8-c86856adcf72","environmentId":"a2afc06e-6c45-4cff-9b2f-e6ba5d4a4ea3"}}'
          response=$(curl --fail-with-body -sS             -X POST "https://backboard.railway.com/graphql/v2"             -H "Authorization: Bearer $RAILWAY_API_TOKEN"             -H "Content-Type: application/json"             --data "$query")
          echo "$response"
          deployment_id=$(echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("errors"), d.get("errors"); print(d["data"]["serviceInstance"]["latestDeployment"]["id"])')
          payload=$(python -c 'import json,sys; print(json.dumps({"query":"mutation Restart($id: String!) { deploymentRestart(id: $id) }","variables":{"id":sys.argv[1]}}))' "$deployment_id")
          restart=$(curl --fail-with-body -sS             -X POST "https://backboard.railway.com/graphql/v2"             -H "Authorization: Bearer $RAILWAY_API_TOKEN"             -H "Content-Type: application/json"             --data "$payload")
          echo "$restart"
          echo "$restart" | python -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("errors"), d.get("errors")'
