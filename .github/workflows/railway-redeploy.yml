name: Futmondo - Railway redeploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'scheduler/railway-redeploy-test.txt'

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar token
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Falta RAILWAY_API_TOKEN"
            exit 1
          fi

      - name: Redeploy futmondo-reader
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SERVICE_ID: "24bc953e-a219-48c8-a7e8-c86856adcf72"
          ENVIRONMENT_ID: "a2afc06e-6c45-4cff-9b2f-e6ba5d4a4ea3"
        run: |
          payload=$(cat <<'JSON'
          {"query":"mutation Redeploy($serviceId: String!, $environmentId: String!) { serviceInstanceRedeploy(serviceId: $serviceId, environmentId: $environmentId) }","variables":{"serviceId":"24bc953e-a219-48c8-a7e8-c86856adcf72","environmentId":"a2afc06e-6c45-4cff-9b2f-e6ba5d4a4ea3"}}
          JSON
          )
          response=$(curl --fail-with-body -sS             -X POST "https://backboard.railway.app/graphql/v2"             -H "Authorization: Bearer $RAILWAY_API_TOKEN"             -H "Content-Type: application/json"             --data "$payload")
          echo "$response"
          echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("errors"), d.get("errors"); assert d.get("data",{}).get("serviceInstanceRedeploy") is not None'
