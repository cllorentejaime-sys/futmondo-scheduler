name: Futmondo - Railway execute

on:
  workflow_dispatch:
  push:
    paths:
      - 'scheduler/railway-redeploy-test.txt'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Validar token
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Falta RAILWAY_API_TOKEN"
            exit 1
          fi

      - name: Configurar servicio como ejecucion bajo demanda
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          payload='{"query":"mutation Update($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }","variables":{"serviceId":"24bc953e-a219-48c8-a7e8-c86856adcf72","environmentId":"a2afc06e-6c45-4cff-9b2f-e6ba5d4a4ea3","input":{"startCommand":"python cloud_entrypoint.py","cronSchedule":null,"restartPolicyType":"NEVER"}}}'
          response=$(curl --fail-with-body -sS             -X POST "https://backboard.railway.com/graphql/v2"             -H "Authorization: Bearer $RAILWAY_API_TOKEN"             -H "Content-Type: application/json"             --data "$payload")
          echo "$response"
          echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("errors"), d.get("errors")'

      - name: Ejecutar futmondo-reader ahora
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          payload='{"query":"mutation Deploy($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }","variables":{"serviceId":"24bc953e-a219-48c8-a7e8-c86856adcf72","environmentId":"a2afc06e-6c45-4cff-9b2f-e6ba5d4a4ea3"}}'
          response=$(curl --fail-with-body -sS             -X POST "https://backboard.railway.com/graphql/v2"             -H "Authorization: Bearer $RAILWAY_API_TOKEN"             -H "Content-Type: application/json"             --data "$payload")
          echo "$response"
          echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("errors"), d.get("errors"); assert d.get("data",{}).get("serviceInstanceDeployV2"), d'
