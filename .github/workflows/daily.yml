name: Futmondo - analisis 08 y 22

on:
  workflow_dispatch:
  push:
    paths:
      - 'scheduler/state-debug-trigger.txt'
  schedule:
    # GitHub cron se evalúa en UTC. Lanzamos las dos horas UTC posibles
    # de España (CET/CEST) y un guard local decide cuál corresponde hoy.
    - cron: '7 6 * * *'
    - cron: '7 7 * * *'
    - cron: '7 20 * * *'
    - cron: '7 21 * * *'

permissions:
  contents: write

concurrency:
  group: futmondo-full-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Validar hora Europe/Madrid
        id: clock
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              run = True
          else:
              schedule = os.environ.get("EVENT_SCHEDULE", "")
              parts = schedule.split()
              run = False
              if len(parts) >= 2:
                  minute = int(parts[0])
                  hour = int(parts[1])
                  now = datetime.now(timezone.utc)
                  scheduled = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
                  local = scheduled.astimezone(ZoneInfo("Europe/Madrid"))
                  run = (local.hour, local.minute) in {(8, 7), (22, 7)}
                  print(f"Horario programado UTC: {scheduled.isoformat()} -> Madrid: {local.isoformat()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Checkout scheduler
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Comprobar configuracion
        if: steps.clock.outputs.run == 'true'
        id: config
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
        run: |
          missing=0
          for name in PRIVATE_REPO_TOKEN FUTMONDO_EMAIL FUTMONDO_PASSWORD FUTMONDO_CHAMPIONSHIP_ID FUTMONDO_USERTEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::Falta configurar $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo privado
        if: steps.clock.outputs.run == 'true' && steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: cllorentejaime-sys/futmondo-reader-cloud
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Preparar Python
        if: steps.clock.outputs.run == 'true' && steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.clock.outputs.run == 'true' && steps.config.outputs.ready == 'true'
        run: pip install -r private/requirements.txt

      - name: Preparar runtime
        if: steps.clock.outputs.run == 'true' && steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/futmondo-data/salida"
          cp private/data/futmondo_resumen_ULTIMO.json "$RUNNER_TEMP/futmondo-data/salida/futmondo_resumen_ULTIMO.json" || true

      - name: Actualizar Futmondo y publicar JSON
        if: steps.clock.outputs.run == 'true' && steps.config.outputs.ready == 'true'
        working-directory: private
        env:
          FUTMONDO_DATA_DIR: ${{ runner.temp }}/futmondo-data
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          CLOUD_TIMEZONE: Europe/Madrid
          GITHUB_SYNC_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GITHUB_SYNC_REPO: cllorentejaime-sys/futmondo-reader-cloud
          GITHUB_SYNC_BRANCH: main
          GITHUB_SYNC_PATH: data/futmondo_resumen_ULTIMO.json
        run: |
          python unpack_cloud.py
          python cloud_runner.py --force
          python publish_to_github.py

      - name: Calcular proxima renovacion
        if: steps.clock.outputs.run == 'true' && steps.config.outputs.ready == 'true'
        env:
          SUMMARY_PATH: ${{ runner.temp }}/futmondo-data/salida/futmondo_resumen_ULTIMO.json
        run: python scheduler/update_renew_schedule.py

      - name: Guardar programacion
        if: steps.clock.outputs.run == 'true' && steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > scheduler/heartbeat.txt
          git config user.name "futmondo-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/renew.yml scheduler/next_renewal.json scheduler/heartbeat.txt
          if git diff --cached --quiet; then
            echo "Sin cambios de programacion."
          else
            git commit -m "scheduler: actualizar proxima renovacion"
            git push
          fi

      - name: Inventariar estado runtime
        if: always()
        shell: bash
        run: |
          echo "=== FILES ==="
          find "$RUNNER_TEMP/futmondo-data" -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort || true
